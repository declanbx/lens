[package]
name = "lens"
version = "0.1.0"
description = "Lens — a glass, mouse-first Finder over the repo_index INDEX.sqlite"
authors = ["Declan"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique vs the bin name (Windows linker quirk,
# rust-lang/cargo#8519) — same convention as the proven figpolish + spike apps.
name = "lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is REQUIRED for the transparent window + apply_vibrancy combo
# (proven bundled in lens_spike this session).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite over INDEX.sqlite. "bundled" vendors a fixed SQLite (FTS5 compiled in) so the app
# never depends on the host's libsqlite3. Pinned to rusqlite 0.40 whose bundled libsqlite3-sys
# ships SQLite >= 3.51.3 — REQUIRED: 3.7.0..=3.51.2 corrupt a WAL db under >=2 concurrent
# writers/checkpointers (the reader-pool + writer design), fixed 3.51.3
# (https://sqlite.org/wal.html#walresetbug). See PHASE_0_1_SPEC.md §3.0 / §0.5A.
rusqlite = { version = "0.40", features = ["bundled"] }

# markdown preview pipeline served via repoindex://md/<id>:
#   comrak renders MD -> HTML (unsafe OFF), ammonia sanitizes the result (allowlist).
comrak = "0.29"
ammonia = "4"

# async runtime for the #[tauri::command]s (Mutex-guarded Connection + future-proofing).
tokio = { version = "1", features = ["sync", "macros", "rt"] }

# native folder picker for "Add folder…" (open({ directory: true })). "2" tracks the resident
# tauri = "2" (resolves to 2.7.1); only the `open` dialog command is used (capability: dialog:default).
tauri-plugin-dialog = "2"

# Native file DRAG-OUT (drag a row onto Finder / Inkscape / any app), CrabNebula's drag plugin.
# Frontend calls startDrag({ item:[absPath], icon, mode }) → an OS NSDraggingSession (capability:
# drag:default). The macOS impl PANICS if `icon` is a path that isn't a valid NSImage, so the
# frontend only ever passes a real raster image (the file itself for png/jpg/… , else a bundled
# fallback PNG resolved via resolveResource).
tauri-plugin-drag = "2"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
libc = "0.2"
notify = "6"

# macOS NSVisualEffectView vibrancy. 0.7.1 exposes apply_vibrancy(window, effect,
# Option<state>, Option<radius>) — the EXACT signature proven in lens_spike this session.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7.1"
